# speckit-gate: core preset
# Built-in spec-kit commands only — verified against upstream templates/commands/.
# Built-in set (as of mid-2026): analyze, checklist, clarify, constitution,
#   converge, implement, plan, specify, tasks, taskstoissues.
#
# Do NOT add community-extension commands here; users won't have them installed.
# For extension gates see presets/extensions.example.gates.yaml.

config:
  prefix: speckit.
  feature_root: specs
  resolve: [git-branch, newest-dir]
  messages:
    no_feature: >-
      No active spec-kit feature resolved (no SPECIFY_FEATURE_DIRECTORY,
      .specify/feature.json, or specs/<branch>/ match).
      Run /speckit.specify first or switch to the feature branch.

gates:

  # --- spec phase ---

  constitution:
    requires: []
    produces: [specs/<feat>/constitution.md]
    context: >-
      Create or update the project constitution. Establishes governance
      principles before any feature spec is written.

  specify:
    requires: []
    produces: [specs/<feat>/spec.md]
    context: >-
      Initial spec authoring. Must precede all other phases.

  clarify:
    requires: [specify]
    produces: [specs/<feat>/clarifications.md]
    context: >-
      Resolves ambiguities left open in spec.md. Skip if the spec is
      already unambiguous.

  plan:
    requires: [specify]
    produces: [specs/<feat>/plan.md]
    context: >-
      Decomposes spec into design and implementation plan. If plan.md
      already exists use the refine path to amend rather than re-planning
      from scratch.

  tasks:
    requires: [plan]
    produces: [specs/<feat>/tasks.md]
    context: >-
      Decomposes the plan into discrete, testable tasks. If tasks.md
      already exists you are iterating or refining.

  checklist:
    requires: [specify, plan, tasks]
    produces: [specs/<feat>/checklist.md]
    context: >-
      Requirements-quality gate over spec + plan + tasks before
      implementation.

  analyze:
    requires: [tasks]
    produces: [specs/<feat>/analysis.md]
    context: >-
      Surfaces risks, missing tasks, and over-broad tasks.

  taskstoissues:
    requires: [tasks]
    produces: [specs/<feat>/issue-map.md]
    context: >-
      Turns tasks into trackable GitHub issues.

  # --- implementation phase ---

  implement:
    requires: [tasks]
    produces: []
    context: >-
      Executes the implementation plan by processing and executing all
      tasks defined in tasks.md.

  converge:
    requires: [specify, plan, tasks]
    produces: [specs/<feat>/tasks.md]
    context: >-
      Closes the gap between spec/plan/tasks intent and what the code
      actually implements. APPEND-ONLY to tasks.md.
