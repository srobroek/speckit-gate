name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use a PAT so the release PR triggers required checks.
          # Create a fine-grained token with Contents + Pull Requests write
          # permissions and store it as a repo secret named RELEASE_PLEASE_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Optional: build and attach wheel to GitHub release when one is created.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Install uv
        if: ${{ steps.release.outputs.release_created }}
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        if: ${{ steps.release.outputs.release_created }}
        run: uv build

      - name: Upload wheel to GitHub release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} dist/*.whl dist/*.tar.gz

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

  # PyPI via Trusted Publishing (OIDC) — register this repo+workflow+environment
  # as a pending publisher at pypi.org before the first release lands.
  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
